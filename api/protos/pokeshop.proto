syntax = "proto3";

package pokeshop;

service Pokeshop {
  rpc GetPokemonList(GetPokemonListRequest) returns (GetPokemonListResponse);
}

message GetPokemonListRequest {
  int32 skip = 1;
  int32 take = 2;
}

message Pokemon {
  int32 id = 1;
  string name = 2;
  string type = 3;
  bool isFeatured = 4;
  string imageUrl = 5;
}

message GetPokemonListResponse {
  repeated Pokemon items = 1;
  int32 totalCount = 2;
}
