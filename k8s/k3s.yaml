apiVersion: v1
kind: Namespace
metadata:
  name: pokeshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: postgres:14
          env:
            - {name: POSTGRES_USER, value: ashketchum}
            - {name: POSTGRES_PASSWORD, value: squirtle123}
            - {name: POSTGRES_DB, value: pokeshop}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, ashketchum, -d, pokeshop]
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: pokeshop
spec:
  selector: {app: db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: cache
          image: redis:6
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: pokeshop
spec:
  selector: {app: cache}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: queue}
  template:
    metadata:
      labels: {app: queue}
    spec:
      containers:
        - name: queue
          image: rabbitmq:3.12
          ports:
            - {name: amqp, containerPort: 5672}
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: pokeshop
spec:
  selector: {app: queue}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream
  namespace: pokeshop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: stream}
  template:
    metadata:
      labels: {app: stream}
    spec:
      containers:
        - name: stream
          image: confluentinc/cp-kafka:latest-ubi8
          env:
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://stream:9092'}
            - {name: KAFKA_LISTENERS, value: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093'}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0'}
            - {name: KAFKA_PROCESS_ROLES, value: 'controller,broker'}
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_METADATA_LOG_SEGMENT_MS, value: '15000'}
            - {name: KAFKA_METADATA_MAX_RETENTION_MS, value: '60000'}
            - {name: KAFKA_METADATA_LOG_MAX_RECORD_BYTES_BETWEEN_SNAPSHOTS, value: '2800'}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'true'}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_HEAP_OPTS, value: '-Xmx200m -Xms200m'}
            - {name: CLUSTER_ID, value: ckjPoprWQzOf0-FuNkGfFQ}
          ports:
            - {name: kafka, containerPort: 9092}
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: stream
  namespace: pokeshop
spec:
  publishNotReadyAddresses: true
  selector: {app: stream}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, 'until nc -z db 5432 && nc -z cache 6379 && nc -z queue 5672; do sleep 1; done']
      containers:
        - name: api
          image: pokeshop-api:k3s
          imagePullPolicy: Never
          env:
            - {name: REDIS_URL, value: cache}
            - {name: DATABASE_URL, value: 'postgresql://ashketchum:squirtle123@db:5432/pokeshop?schema=public'}
            - {name: RABBITMQ_HOST, value: queue}
            - {name: POKE_API_BASE_URL, value: 'https://pokeapi.co/api/v2'}
          ports:
            - {name: http, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /pokemon/healthcheck, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pokeshop
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - {name: http, port: 8081, targetPort: http, nodePort: 30081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: [sh, -c, 'until wget -q -O /dev/null http://api:8081/pokemon/healthcheck; do sleep 1; done']
      containers:
        - name: web
          image: pokeshop-web:k3s
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pokeshop
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: rpc}
  template:
    metadata:
      labels: {app: rpc}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, 'until nc -z db 5432; do sleep 1; done']
      containers:
        - name: rpc
          image: pokeshop-api:k3s
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: 'postgresql://ashketchum:squirtle123@db:5432/pokeshop?schema=public'}
            - {name: NPM_RUN_COMMAND, value: rpc}
            - {name: RPC_PORT, value: '8082'}
          ports:
            - {name: grpc, containerPort: 8082}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rpc
  namespace: pokeshop
spec:
  selector: {app: rpc}
  ports:
    - {name: grpc, port: 8082, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, 'until nc -z db 5432 && nc -z cache 6379 && nc -z queue 5672; do sleep 1; done']
      containers:
        - name: worker
          image: pokeshop-api:k3s
          imagePullPolicy: Never
          env:
            - {name: REDIS_URL, value: cache}
            - {name: DATABASE_URL, value: 'postgresql://ashketchum:squirtle123@db:5432/pokeshop?schema=public'}
            - {name: RABBITMQ_HOST, value: queue}
            - {name: POKE_API_BASE_URL, value: 'https://pokeapi.co/api/v2'}
            - {name: NPM_RUN_COMMAND, value: worker}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-worker
  namespace: pokeshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: streaming-worker}
  template:
    metadata:
      labels: {app: streaming-worker}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: [sh, -c, 'until nc -z db 5432 && nc -z cache 6379 && nc -z stream 9092; do sleep 1; done']
      containers:
        - name: streaming-worker
          image: pokeshop-api:k3s
          imagePullPolicy: Never
          env:
            - {name: DATABASE_URL, value: 'postgresql://ashketchum:squirtle123@db:5432/pokeshop?schema=public'}
            - {name: POKE_API_BASE_URL, value: 'https://pokeapi.co/api/v2'}
            - {name: NPM_RUN_COMMAND, value: stream-worker}
            - {name: KAFKA_BROKER, value: 'stream:9092'}
            - {name: KAFKA_TOPIC, value: pokemon}
            - {name: KAFKA_CLIENT_ID, value: streaming-worker}
            - {name: REDIS_URL, value: cache}
